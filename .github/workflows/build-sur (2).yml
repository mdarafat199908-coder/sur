name: Build Sur APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/sur/music
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          printf '%s\n' \
            "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" \
            "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" \
            "rootProject.name = 'Sur'" \
            "include ':app'" > settings.gradle

          printf '%s\n' \
            "plugins {" \
            "    id 'com.android.application' version '8.6.1' apply false" \
            "}" > build.gradle

          printf '%s\n' \
            "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" \
            "android.useAndroidX=true" > gradle.properties

          printf '%s\n' \
            "plugins {" \
            "    id 'com.android.application'" \
            "}" \
            "" \
            "android {" \
            "    namespace 'com.sur.music'" \
            "    compileSdk 35" \
            "" \
            "    defaultConfig {" \
            "        applicationId 'com.sur.music'" \
            "        minSdk 23" \
            "        targetSdk 35" \
            "        versionCode 1" \
            "        versionName '1.0'" \
            "    }" \
            "}" > app/build.gradle

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
            '    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />' \
            '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />' \
            '    <application' \
            '        android:theme="@style/AppTheme"' \
            '        android:label="Sur"' \
            '        android:icon="@drawable/ic_sur_icon"' \
            '        android:roundIcon="@drawable/ic_sur_icon"' \
            '        android:allowBackup="true"' \
            '        android:supportsRtl="true">' \
            '        <activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true">' \
            '            <intent-filter>' \
            '                <action android:name="android.intent.action.MAIN" />' \
            '                <category android:name="android.intent.category.LAUNCHER" />' \
            '            </intent-filter>' \
            '        </activity>' \
            '    </application>' \
            '</manifest>' > app/src/main/AndroidManifest.xml

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources>' \
            '    <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">' \
            '        <item name="android:fontFamily">sans</item>' \
            '        <item name="android:colorAccent">#BB86FC</item>' \
            '        <item name="android:navigationBarColor">#0B0B16</item>' \
            '        <item name="android:statusBarColor">#0B0B16</item>' \
            '        <item name="android:windowLightStatusBar">false</item>' \
            '    </style>' \
            '</resources>' > app/src/main/res/values/styles.xml

          printf '%s\n' \
            '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">' \
            '    <path android:fillColor="#BB86FC" android:pathData="M54,8A46,46 0,1 0,54 100A46,46 0,1 0,54 8M45,30L78,48L45,66Z" />' \
            '</vector>' > app/src/main/res/drawable/ic_sur_icon.xml

          printf '%s\n' \
            'package com.sur.music;' \
            '' \
            'import android.Manifest;' \
            'import android.app.Activity;' \
            'import android.content.ContentUris;' \
            'import android.content.pm.PackageManager;' \
            'import android.database.Cursor;' \
            'import android.media.MediaPlayer;' \
            'import android.net.Uri;' \
            'import android.os.Build;' \
            'import android.os.Bundle;' \
            'import android.provider.MediaStore;' \
            'import android.graphics.Color;' \
            'import android.graphics.Typeface;' \
            'import android.view.Gravity;' \
            'import android.view.View;' \
            'import android.widget.*;' \
            'import java.util.ArrayList;' \
            'import java.util.HashSet;' \
            'import java.util.Set;' \
            '' \
            'public class MainActivity extends Activity {' \
            '    LinearLayout root, list;' \
            '    EditText search;' \
            '    TextView nowTitle, nowArtist;' \
            '    Button playButton;' \
            '    MediaPlayer player;' \
            '    ArrayList<String> titles = new ArrayList<>();' \
            '    ArrayList<String> artists = new ArrayList<>();' \
            '    ArrayList<Uri> uris = new ArrayList<>();' \
            '    Set<String> favorites = new HashSet<>();' \
            '    int current = -1;' \
            '' \
            '    int dp(float n) { return (int)(n * getResources().getDisplayMetrics().density + .5f); }' \
            '    TextView text(String s, float size) {' \
            '        TextView t = new TextView(this);' \
            '        t.setText(s); t.setTextSize(size); t.setTextColor(Color.WHITE);' \
            '        t.setPadding(dp(12), dp(10), dp(12), dp(10));' \
            '        return t;' \
            '    }' \
            '' \
            '    @Override public void onCreate(Bundle b) {' \
            '        super.onCreate(b);' \
            '        build();' \
            '        if (Build.VERSION.SDK_INT >= 33) {' \
            '            if (checkSelfPermission(Manifest.permission.READ_MEDIA_AUDIO) != PackageManager.PERMISSION_GRANTED) requestPermissions(new String[]{Manifest.permission.READ_MEDIA_AUDIO}, 10);' \
            '            else loadSongs();' \
            '        } else {' \
            '            if (checkSelfPermission(Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) requestPermissions(new String[]{Manifest.permission.READ_EXTERNAL_STORAGE}, 10);' \
            '            else loadSongs();' \
            '        }' \
            '    }' \
            '' \
            '    void build() {' \
            '        root = new LinearLayout(this); root.setOrientation(LinearLayout.VERTICAL); root.setBackgroundColor(Color.rgb(11,11,22));' \
            '        TextView head = text("♫  Sur", 28); head.setTypeface(null, Typeface.BOLD);' \
            '        head.setTextColor(Color.rgb(210,150,255)); root.addView(head, new LinearLayout.LayoutParams(-1, dp(65)));' \
            '        search = new EditText(this); search.setHint("Search songs or artists"); search.setHintTextColor(Color.GRAY); search.setTextColor(Color.WHITE); search.setSingleLine();' \
            '        root.addView(search, new LinearLayout.LayoutParams(-1, dp(55)));' \
            '        list = new LinearLayout(this); list.setOrientation(LinearLayout.VERTICAL);' \
            '        ScrollView scroll = new ScrollView(this); scroll.addView(list); root.addView(scroll, new LinearLayout.LayoutParams(-1, 0, 1));' \
            '        LinearLayout mini = new LinearLayout(this); mini.setGravity(Gravity.CENTER_VERTICAL); mini.setPadding(dp(8),0,dp(8),0); mini.setBackgroundColor(Color.rgb(25,20,38));' \
            '        LinearLayout info = new LinearLayout(this); info.setOrientation(LinearLayout.VERTICAL);' \
            '        nowTitle = text("Nothing playing",16); nowArtist = text("",12); info.addView(nowTitle); info.addView(nowArtist);' \
            '        mini.addView(info,new LinearLayout.LayoutParams(0,dp(65),1));' \
            '        playButton = new Button(this); playButton.setText("▶"); mini.addView(playButton,new LinearLayout.LayoutParams(dp(65),dp(60)));' \
            '        playButton.setOnClickListener(v -> toggle()); root.addView(mini);' \
            '        LinearLayout nav = new LinearLayout(this); nav.setGravity(Gravity.CENTER);' \
            '        String[] ns={"Home","All Songs","Favorites"};' \
            '        for(String n:ns){ Button x=new Button(this); x.setText(n); nav.addView(x,new LinearLayout.LayoutParams(0,dp(55),1)); if(n.equals("Favorites")) x.setOnClickListener(v->showFavorites()); else x.setOnClickListener(v->showAll()); }' \
            '        root.addView(nav); setContentView(root);' \
            '        search.addTextChangedListener(new android.text.TextWatcher(){ public void beforeTextChanged(CharSequence s,int a,int c,int d){} public void onTextChanged(CharSequence s,int a,int b,int c){filter(s.toString());} public void afterTextChanged(android.text.Editable e){} });' \
            '    }' \
            '' \
            '    @Override public void onRequestPermissionsResult(int r,String[] p,int[] g){ super.onRequestPermissionsResult(r,p,g); if(r==10 && g.length>0 && g[0]==PackageManager.PERMISSION_GRANTED) loadSongs(); else Toast.makeText(this,"Music permission is required",Toast.LENGTH_LONG).show(); }' \
            '' \
            '    void loadSongs(){' \
            '        titles.clear(); artists.clear(); uris.clear();' \
            '        String[] proj={MediaStore.Audio.Media._ID,MediaStore.Audio.Media.TITLE,MediaStore.Audio.Media.ARTIST};' \
            '        String sel=MediaStore.Audio.Media.IS_MUSIC+" != 0";' \
            '        try(Cursor c=getContentResolver().query(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI,proj,sel,null,MediaStore.Audio.Media.TITLE+" ASC")){' \
            '            if(c!=null) while(c.moveToNext()){ long id=c.getLong(0); titles.add(c.getString(1)); artists.add(c.getString(2)); uris.add(ContentUris.withAppendedId(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI,id)); }' \
            '        }' \
            '        showAll();' \
            '    }' \
            '' \
            '    void showAll(){ list.removeAllViews(); for(int i=0;i<titles.size();i++) addSong(i); }' \
            '    void showFavorites(){ list.removeAllViews(); for(int i=0;i<titles.size();i++) if(favorites.contains(uris.get(i).toString())) addSong(i); }' \
            '    void filter(String q){ if(titles==null)return; list.removeAllViews(); q=q.toLowerCase(); for(int i=0;i<titles.size();i++) if(titles.get(i).toLowerCase().contains(q)||artists.get(i).toLowerCase().contains(q)) addSong(i); }' \
            '' \
            '    void addSong(final int i){' \
            '        LinearLayout row=new LinearLayout(this); row.setGravity(Gravity.CENTER_VERTICAL); row.setPadding(dp(4),dp(3),dp(4),dp(3));' \
            '        LinearLayout info=new LinearLayout(this); info.setOrientation(LinearLayout.VERTICAL);' \
            '        TextView a=text(titles.get(i),17); a.setTypeface(null,Typeface.BOLD); TextView b=text(artists.get(i),13); b.setTextColor(Color.LTGRAY); info.addView(a); info.addView(b);' \
            '        row.addView(info,new LinearLayout.LayoutParams(0,dp(70),1));' \
            '        Button fav=new Button(this); fav.setText(favorites.contains(uris.get(i).toString())?"♥":"♡"); row.addView(fav,new LinearLayout.LayoutParams(dp(55),dp(60)));' \
            '        row.setOnClickListener(v->play(i)); fav.setOnClickListener(v->{String k=uris.get(i).toString(); if(favorites.contains(k)){favorites.remove(k);fav.setText("♡");}else{favorites.add(k);fav.setText("♥");}});' \
            '        list.addView(row,new LinearLayout.LayoutParams(-1,dp(76)));' \
            '    }' \
            '' \
            '    void play(int i){ try{ if(player!=null) player.release(); player=MediaPlayer.create(this,uris.get(i)); current=i; if(player!=null){player.start();playButton.setText("Ⅱ");nowTitle.setText(titles.get(i));nowArtist.setText(artists.get(i));}}catch(Exception e){Toast.makeText(this,"Cannot play this song",Toast.LENGTH_SHORT).show();} }' \
            '    void toggle(){ if(player==null){if(current>=0)play(current);return;} if(player.isPlaying()){player.pause();playButton.setText("▶");}else{player.start();playButton.setText("Ⅱ");} }' \
            '    @Override protected void onDestroy(){if(player!=null)player.release();super.onDestroy();}' \
            '}' > app/src/main/java/com/sur/music/MainActivity.java

      - name: Check project
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/sur/music/MainActivity.java
          echo "Project files OK"

      - name: Build APK
        run: |
          gradle --no-daemon clean assembleDebug
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/Sur.apk
          ls -lh output/Sur.apk

      - name: Upload Sur APK
        uses: actions/upload-artifact@v4
        with:
          name: Sur-APK
          path: output/Sur.apk
          if-no-files-found: error
