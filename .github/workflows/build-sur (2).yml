name: Build Sur APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Android project files
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/sur/music
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          printf '%s\n' \
          "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" \
          "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" \
          "rootProject.name = 'Sur'" \
          "include ':app'" > settings.gradle

          printf '%s\n' \
          "plugins {" \
          "    id 'com.android.application' version '8.6.1' apply false" \
          "}" > build.gradle

          printf '%s\n' \
          "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" \
          "android.useAndroidX=true" > gradle.properties

          printf '%s\n' \
          "plugins {" \
          "    id 'com.android.application'" \
          "}" \
          "" \
          "android {" \
          "    namespace 'com.sur.music'" \
          "    compileSdk 35" \
          "" \
          "    defaultConfig {" \
          "        applicationId 'com.sur.music'" \
          "        minSdk 23" \
          "        targetSdk 35" \
          "        versionCode 2" \
          "        versionName '1.1'" \
          "    }" \
          "}" > app/build.gradle

          printf '%s\n' \
          "<?xml version=\"1.0\" encoding=\"utf-8\"?>" \
          "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">" \
          "    <uses-permission android:name=\"android.permission.READ_MEDIA_AUDIO\" />" \
          "    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />" \
          "    <application" \
          "        android:allowBackup=\"true\"" \
          "        android:label=\"Sur\"" \
          "        android:theme=\"@style/AppTheme\"" \
          "        android:icon=\"@drawable/ic_sur_icon\"" \
          "        android:roundIcon=\"@drawable/ic_sur_icon\">" \
          "        <activity" \
          "            android:name=\".MainActivity\"" \
          "            android:screenOrientation=\"portrait\"" \
          "            android:exported=\"true\">" \
          "            <intent-filter>" \
          "                <action android:name=\"android.intent.action.MAIN\" />" \
          "                <category android:name=\"android.intent.category.LAUNCHER\" />" \
          "            </intent-filter>" \
          "        </activity>" \
          "    </application>" \
          "</manifest>" > app/src/main/AndroidManifest.xml

          printf '%s\n' \
          "<resources>" \
          "    <style name=\"AppTheme\" parent=\"android:style/Theme.Material.NoActionBar\">" \
          "        <item name=\"android:fontFamily\">sans</item>" \
          "        <item name=\"android:colorAccent\">#B148FF</item>" \
          "        <item name=\"android:statusBarColor\">#050D18</item>" \
          "        <item name=\"android:navigationBarColor\">#050D18</item>" \
          "        <item name=\"android:windowLightStatusBar\">false</item>" \
          "    </style>" \
          "</resources>" > app/src/main/res/values/styles.xml

          printf '%s\n' \
          "<vector xmlns:android=\"http://schemas.android.com/apk/res/android\" android:width=\"108dp\" android:height=\"108dp\" android:viewportWidth=\"108\" android:viewportHeight=\"108\">" \
          "    <path android:fillColor=\"#5414FF\" android:pathData=\"M0,0h108v108h-108z\" />" \
          "    <path android:fillColor=\"#FFFFFF\" android:pathData=\"M62,24v43.5c-3.4,-1.7 -7.2,-2.5 -11,-2.1c-9.4,0.9 -15,6.4 -15,12.2c0,5.8 6.1,9.6 14,8.9c8.8,-0.8 14,-5.8 14,-11.9V43l24,-6v20.5c-3.4,-1.7 -7.2,-2.5 -11,-2.1c-9.4,0.9 -15,6.4 -15,12.2c0,5.8 6.1,9.6 14,8.9c8.8,-0.8 14,-5.8 14,-11.9V24z\" />" \
          "</vector>" > app/src/main/res/drawable/ic_sur_icon.xml

          if [ -f "app/src/main/java/com/sur/music/MainActivity.java" ]; then
            echo "Using MainActivity.java from app source"
          elif [ -f ".github/workflows/MainActivity.java" ]; then
            cp ".github/workflows/MainActivity.java" "app/src/main/java/com/sur/music/MainActivity.java"
            echo "Copied MainActivity.java from .github/workflows"
          else
            echo "ERROR: MainActivity.java was not found."
            exit 1
          fi

          if ! grep -q '^import android.graphics.drawable.GradientDrawable;' app/src/main/java/com/sur/music/MainActivity.java; then
            sed -i '/^package com\.sur\.music;/a import android.graphics.drawable.GradientDrawable;' app/src/main/java/com/sur/music/MainActivity.java
          fi

          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/sur/music/MainActivity.java

      - name: Build APK
        shell: bash
        run: |
          set -e
          gradle --no-daemon clean assembleDebug
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/Sur.apk

      - name: Upload Sur APK
        uses: actions/upload-artifact@v4
        with:
          name: Sur-APK
          path: output/Sur.apk
