name: Build Sur APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/sur/music
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Sur"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.6.1" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.sur.music"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.sur.music"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 2
                  versionName = "1.1"
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#7C4DFF</item>
                  <item name="android:statusBarColor">#101014</item>
                  <item name="android:navigationBarColor">#101014</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />

              <uses-permission
                  android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="সুর"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/sur/music/MainActivity.java <<'EOF'
          package com.sur.music;

          import android.Manifest;
          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Build;
          import android.content.pm.PackageManager;
          import android.provider.MediaStore;
          import android.database.Cursor;
          import android.net.Uri;
          import android.media.MediaPlayer;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ListView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;

          public class MainActivity extends Activity {

              private final ArrayList<String> songNames = new ArrayList<>();
              private final ArrayList<Uri> songUris = new ArrayList<>();

              private MediaPlayer player;
              private int currentIndex = -1;

              private TextView nowPlaying;
              private TextView countText;
              private Button playButton;
              private ListView songList;

              private static final int REQUEST_AUDIO = 10;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  createInterface();

                  if (hasAudioPermission()) {
                      loadSongs();
                  } else {
                      requestAudioPermission();
                  }
              }

              private void createInterface() {

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.rgb(16, 16, 20));

                  TextView title = new TextView(this);
                  title.setText("সুর");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(30);
                  title.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(10, 25, 10, 15);

                  countText = new TextView(this);
                  countText.setText("গান খোঁজা হচ্ছে...");
                  countText.setTextColor(Color.LTGRAY);
                  countText.setTextSize(15);
                  countText.setGravity(Gravity.CENTER);
                  countText.setPadding(10, 5, 10, 10);

                  nowPlaying = new TextView(this);
                  nowPlaying.setText("কোনো গান চলছে না");
                  nowPlaying.setTextColor(Color.WHITE);
                  nowPlaying.setTextSize(18);
                  nowPlaying.setGravity(Gravity.CENTER);
                  nowPlaying.setPadding(10, 15, 10, 20);

                  LinearLayout controls = new LinearLayout(this);
                  controls.setOrientation(LinearLayout.HORIZONTAL);
                  controls.setGravity(Gravity.CENTER);

                  Button previousButton = new Button(this);
                  previousButton.setText("⏮");

                  playButton = new Button(this);
                  playButton.setText("▶");

                  Button nextButton = new Button(this);
                  nextButton.setText("⏭");

                  controls.addView(previousButton);
                  controls.addView(playButton);
                  controls.addView(nextButton);

                  songList = new ListView(this);

                  root.addView(title);
                  root.addView(countText);
                  root.addView(nowPlaying);
                  root.addView(controls);
                  root.addView(
                      songList,
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          1
                      )
                  );

                  setContentView(root);

                  playButton.setOnClickListener(v -> togglePlay());

                  nextButton.setOnClickListener(v -> playNext());

                  previousButton.setOnClickListener(v -> playPrevious());

                  songList.setOnItemClickListener(
                      (parent, view, position, id) -> playSong(position)
                  );
              }

              private boolean hasAudioPermission() {

                  if (Build.VERSION.SDK_INT >= 33) {
                      return checkSelfPermission(
                          Manifest.permission.READ_MEDIA_AUDIO
                      ) == PackageManager.PERMISSION_GRANTED;
                  }

                  return checkSelfPermission(
                      Manifest.permission.READ_EXTERNAL_STORAGE
                  ) == PackageManager.PERMISSION_GRANTED;
              }

              private void requestAudioPermission() {

                  if (Build.VERSION.SDK_INT >= 33) {

                      requestPermissions(
                          new String[]{
                              Manifest.permission.READ_MEDIA_AUDIO
                          },
                          REQUEST_AUDIO
                      );

                  } else {

                      requestPermissions(
                          new String[]{
                              Manifest.permission.READ_EXTERNAL_STORAGE
                          },
                          REQUEST_AUDIO
                      );
                  }
              }

              private void loadSongs() {

                  songNames.clear();
                  songUris.clear();

                  Uri musicUri =
                      MediaStore.Audio.Media.EXTERNAL_CONTENT_URI;

                  String[] projection = {
                      MediaStore.Audio.Media._ID,
                      MediaStore.Audio.Media.TITLE
                  };

                  Cursor cursor = getContentResolver().query(
                      musicUri,
                      projection,
                      MediaStore.Audio.Media.IS_MUSIC + " != 0",
                      null,
                      MediaStore.Audio.Media.TITLE + " ASC"
                  );

                  if (cursor != null) {

                      int idColumn = cursor.getColumnIndex(
                          MediaStore.Audio.Media._ID
                      );

                      int titleColumn = cursor.getColumnIndex(
                          MediaStore.Audio.Media.TITLE
                      );

                      while (cursor.moveToNext()) {

                          long id = cursor.getLong(idColumn);

                          String title =
                              cursor.getString(titleColumn);

                          songNames.add(title);

                          songUris.add(
                              Uri.withAppendedPath(
                                  musicUri,
                                  String.valueOf(id)
                              )
                          );
                      }

                      cursor.close();
                  }

                  countText.setText(
                      songNames.size() + "টি গান"
                  );

                  ArrayAdapter<String> adapter =
                      new ArrayAdapter<String>(
                          this,
                          android.R.layout.simple_list_item_1,
                          songNames
                      ) {

                          @Override
                          public View getView(
                              int position,
                              View convertView,
                              ViewGroup parent
                          ) {

                              TextView text =
                                  (TextView) super.getView(
                                      position,
                                      convertView,
                                      parent
                                  );

                              text.setTextColor(Color.WHITE);
                              text.setTextSize(17);
                              text.setPadding(
                                  25,
                                  22,
                                  15,
                                  22
                              );

                              return text;
                          }
                      };

                  songList.setAdapter(adapter);

                  if (songNames.isEmpty()) {

                      nowPlaying.setText(
                          "ফোনে কোনো গান পাওয়া যায়নি"
                      );
                  }
              }

              private void playSong(int position) {

                  if (position < 0 ||
                      position >= songUris.size()) {
                      return;
                  }

                  releasePlayer();

                  currentIndex = position;

                  player = MediaPlayer.create(
                      this,
                      songUris.get(position)
                  );

                  if (player == null) {

                      Toast.makeText(
                          this,
                          "এই গানটি চালানো যাচ্ছে না",
                          Toast.LENGTH_SHORT
                      ).show();

                      return;
                  }

                  player.setOnCompletionListener(
                      mp -> playNext()
                  );

                  player.start();

                  playButton.setText("⏸");

                  nowPlaying.setText(
                      songNames.get(position)
                  );
              }

              private void togglePlay() {

                  if (player == null) {

                      if (!songUris.isEmpty()) {
                          playSong(0);
                      }

                      return;
                  }

                  if (player.isPlaying()) {

                      player.pause();
                      playButton.setText("▶");

                  } else {

                      player.start();
                      playButton.setText("⏸");
                  }
              }

              private void playNext() {

                  if (songUris.isEmpty()) {
                      return;
                  }

                  int next = currentIndex + 1;

                  if (next >= songUris.size()) {
                      next = 0;
                  }

                  playSong(next);
              }

              private void playPrevious() {

                  if (songUris.isEmpty()) {
                      return;
                  }

                  int previous = currentIndex - 1;

                  if (previous < 0) {
                      previous = songUris.size() - 1;
                  }

                  playSong(previous);
              }

              private void releasePlayer() {

                  if (player != null) {

                      try {
                          player.stop();
                      } catch (Exception ignored) {
                      }

                      player.release();
                      player = null;
                  }
              }

              @Override
              public void onRequestPermissionsResult(
                  int requestCode,
                  String[] permissions,
                  int[] grantResults
              ) {

                  super.onRequestPermissionsResult(
                      requestCode,
                      permissions,
                      grantResults
                  );

                  if (requestCode == REQUEST_AUDIO &&
                      grantResults.length > 0 &&
                      grantResults[0] ==
                          PackageManager.PERMISSION_GRANTED) {

                      loadSongs();

                  } else {

                      Toast.makeText(
                          this,
                          "গান দেখাতে Storage permission প্রয়োজন",
                          Toast.LENGTH_LONG
                      ).show();
                  }
              }

              @Override
              protected void onDestroy() {

                  releasePlayer();

                  super.onDestroy();
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle --no-daemon clean assembleDebug
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/Sur.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sur-APK
          path: output/Sur.apk
          if-no-files-found: error
