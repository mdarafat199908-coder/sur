name: Build Sur APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/sur/music
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Sur"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.6.1" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.sur.music"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.sur.music"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#7C4DFF</item>
                  <item name="android:statusBarColor">#101014</item>
                  <item name="android:navigationBarColor">#101014</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
              <uses-permission
                  android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="সুর"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/sur/music/MainActivity.java <<'EOF'
          package com.sur.music;

          import android.Manifest;
          import android.app.Activity;
          import android.os.*;
          import android.content.pm.PackageManager;
          import android.provider.MediaStore;
          import android.database.Cursor;
          import android.net.Uri;
          import android.media.MediaPlayer;
          import android.graphics.Color;
          import android.view.*;
          import android.widget.*;
          import java.util.*;

          public class MainActivity extends Activity {

              ArrayList<String> names = new ArrayList<>();
              ArrayList<Uri> files = new ArrayList<>();
              MediaPlayer player;
              int current = -1;
              TextView now;
              Button play;

              @Override
              public void onCreate(Bundle b) {
                  super.onCreate(b);
                  makeUI();

                  if (permission())
                      load();
                  else
                      ask();
              }

              void makeUI() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.rgb(16,16,20));

                  TextView title = new TextView(this);
                  title.setText("সুর");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(30);
                  title.setGravity(17);
                  title.setPadding(10,25,10,15);

                  now = new TextView(this);
                  now.setText("কোনো গান চলছে না");
                  now.setTextColor(Color.WHITE);
                  now.setTextSize(18);
                  now.setGravity(17);
                  now.setPadding(10,10,10,20);

                  LinearLayout buttons = new LinearLayout(this);
                  buttons.setGravity(17);

                  Button prev = new Button(this);
                  prev.setText("⏮");

                  play = new Button(this);
                  play.setText("▶");

                  Button next = new Button(this);
                  next.setText("⏭");

                  buttons.addView(prev);
                  buttons.addView(play);
                  buttons.addView(next);

                  ListView list = new ListView(this);

                  root.addView(title);
                  root.addView(now);
                  root.addView(buttons);
                  root.addView(list,new LinearLayout.LayoutParams(-1,0,1));

                  setContentView(root);

                  play.setOnClickListener(v -> toggle());
                  next.setOnClickListener(v -> next());
                  prev.setOnClickListener(v -> previous());

                  list.setOnItemClickListener(
                      (p,v,pos,id) -> playSong(pos));
              }

              boolean permission() {
                  if (Build.VERSION.SDK_INT >= 33)
                      return checkSelfPermission(
                          Manifest.permission.READ_MEDIA_AUDIO)
                          == PackageManager.PERMISSION_GRANTED;

                  return checkSelfPermission(
                      Manifest.permission.READ_EXTERNAL_STORAGE)
                      == PackageManager.PERMISSION_GRANTED;
              }

              void ask() {
                  if (Build.VERSION.SDK_INT >= 33)
                      requestPermissions(
                          new String[]{Manifest.permission.READ_MEDIA_AUDIO},10);
                  else
                      requestPermissions(
                          new String[]{Manifest.permission.READ_EXTERNAL_STORAGE},10);
              }

              void load() {
                  names.clear();
                  files.clear();

                  Uri base = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI;

                  String[] p = {
                      MediaStore.Audio.Media._ID,
                      MediaStore.Audio.Media.TITLE
                  };

                  Cursor c = getContentResolver().query(
                      base,p,
                      MediaStore.Audio.Media.IS_MUSIC+" != 0",
                      null,
                      MediaStore.Audio.Media.TITLE+" ASC");

                  if(c != null) {
                      int id = c.getColumnIndex(
                          MediaStore.Audio.Media._ID);
                      int title = c.getColumnIndex(
                          MediaStore.Audio.Media.TITLE);

                      while(c.moveToNext()) {
                          long x = c.getLong(id);
                          names.add(c.getString(title));
                          files.add(Uri.withAppendedPath(
                              base,String.valueOf(x)));
                      }
                      c.close();
                  }

                  ListView list = findViewById(
                      android.R.id.content);

                  ArrayAdapter<String> adapter =
                      new ArrayAdapter<String>(
                          this,
                          android.R.layout.simple_list_item_1,
                          names) {

                          public View getView(
                              int pos, View v, ViewGroup p) {

                              TextView t = (TextView)
                                  super.getView(pos,v,p);

                              t.setTextColor(Color.WHITE);
                              t.setTextSize(17);
                              t.setPadding(25,20,10,20);
                              return t;
                          }
                      };

                  ((ListView)((ViewGroup)
                      ((ViewGroup)findViewById(
                          android.R.id.content)).getChildAt(0))
                      .getChildAt(3)).setAdapter(adapter);
              }

              void playSong(int pos) {
                  if(pos < 0 || pos >= files.size()) return;

                  release();
                  current = pos;

                  player = MediaPlayer.create(this,files.get(pos));

                  if(player == null) {
                      Toast.makeText(
                          this,"গানটি চালানো যাচ্ছে না",
                          Toast.LENGTH_SHORT).show();
                      return;
                  }

                  player.setOnCompletionListener(v -> next());
                  player.start();

                  play.setText("⏸");
                  now.setText(names.get(pos));
              }

              void toggle() {
                  if(player == null) {
                      if(!files.isEmpty()) playSong(0);
                      return;
                  }

                  if(player.isPlaying()) {
                      player.pause();
                      play.setText("▶");
                  } else {
                      player.start();
                      play.setText("⏸");
                  }
              }

              void next() {
                  if(files.isEmpty()) return;

                  int n = current + 1;
                  if(n >= files.size()) n = 0;
                  playSong(n);
              }

              void previous() {
                  if(files.isEmpty()) return;

                  int n = current - 1;
                  if(n < 0) n = files.size()-1;
                  playSong(n);
              }

              void release() {
                  if(player != null) {
                      try { player.stop(); }
                      catch(Exception e) {}

                      player.release();
                      player = null;
                  }
              }

              @Override
              public void onRequestPermissionsResult(
                  int r,String[] p,int[] g) {

                  super.onRequestPermissionsResult(r,p,g);

                  if(r == 10 &&
                     g.length > 0 &&
                     g[0] == PackageManager.PERMISSION_GRANTED)
                      load();
              }

              @Override
              protected void onDestroy() {
                  release();
                  super.onDestroy();
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle --no-daemon clean assembleDebug
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/Sur.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sur-APK
          path: output/Sur.apk
          if-no-files-found: error
